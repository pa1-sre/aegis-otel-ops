apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resource-requests-limits
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        aegis-policy: enforce
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["pods"]
  validations:
  - expression: >-
      object.spec.containers.all(c,
        has(c.resources) && has(c.resources.requests) && has(c.resources.limits) &&
        'cpu' in c.resources.requests && 'memory' in c.resources.requests && 'memory' in c.resources.limits)
    message: "Containers must set cpu and memory requests and a memory limit."
